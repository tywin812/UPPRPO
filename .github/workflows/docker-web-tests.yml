name: Docker Build and Push

on:
  push:
    branches: 
      - feature-docker-web-hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest -f tywin812/UPPRPO/lab2/Dockerfile.app .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-app:latest

      - name: Build and push web image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-web:latest -f tywin812/UPPRPO/lab2/Dockerfile.web .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test-repo-web:latest